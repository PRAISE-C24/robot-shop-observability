config:
  modules:
    http_2xx:
      prober: http
      timeout: 5s
      http:
        valid_http_versions:
          - HTTP/1.1
          - HTTP/2.0
        follow_redirects: true
        preferred_ip_protocol: ip4

serviceMonitor:
  enabled: true
  defaults:
    labels:
      release: kube-prometheus-stack
    interval: 30s
    scrapeTimeout: 10s
    module: http_2xx
  targets:
    - name: robot-shop-frontpage
      url: http://web.robot-shop.svc.cluster.local:8080/
    - name: robot-shop-catalogue
      url: http://web.robot-shop.svc.cluster.local:8080/api/catalogue/categories
    - name: robot-shop-shipping
      url: http://web.robot-shop.svc.cluster.local:8080/api/shipping/codes