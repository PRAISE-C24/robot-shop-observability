alertmanager:
  alertmanagerSpec:
    secrets:
      - slack-webhook

  config:
    global:
      resolve_timeout: 5m

    route:
      receiver: slack
      group_by:
        - alertname
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
        - receiver: "null"
          matchers:
            - alertname = "InfoInhibitor"

    receivers:
      - name: "null"
      - name: slack
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack-webhook/slack-webhook-url
            channel: "#alerts"
            send_resolved: true