name: infra

on:
  pull_request:
    paths:
      - "infra/eks/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "infra/eks/**"
      - ".github/workflows/infra.yml"

permissions:
  id-token: write   # lets the job request the OIDC token
  contents: read

concurrency:
  group: terraform-eks
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_admin_user_arn: ${{ vars.ADMIN_USER_ARN }}
  TF_VAR_pipeline_role_arn: ${{ vars.AWS_APPLY_ROLE_ARN }}

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/eks
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">= 1.10"
          terraform_wrapper: false
      
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Show who we are
        run: aws sts get-caller-identity

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=robot-shop-observability/eks/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -lock-timeout=5m -out=tfplan

      - name: Plan totals in the job summary
        if: always()
        run: |
          terraform show -json tfplan | jq -r '
            [.resource_changes[].change.actions] as $a
            | "### Plan: \($a | map(select(any(.[]; . == "create"))) | length) to add, \($a | map(select(any(.[]; . == "update"))) | length) to change, \($a | map(select(any(.[]; . == "delete"))) | length) to destroy"
          ' >> "$GITHUB_STEP_SUMMARY" || true  

      - name: Add plan to the job summary
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          terraform show -no-color tfplan >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"