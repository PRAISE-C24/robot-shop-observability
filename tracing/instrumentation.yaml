apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: robot-shop
  namespace: robot-shop
spec:
  exporter:
    endpoint: http://jaeger.tracing.svc.cluster.local:4318
  propagators:
    - tracecontext
    - baggage
  sampler:
    type: parentbased_traceidratio
    argument: "1"